<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Block Mined Successfully</title>
    <style>
        /* Base Styles */
        :root {
            --color-primary: #28a745; /* Green for success */
            --color-background: #f4f7f9; /* Off-white background */
            --color-surface: #ffffff; /* Card Background */
            --color-text: #343a40; /* Dark Text */
            --color-border: #c3e6cb; /* Light green border */
            --color-shadow: rgba(0, 0, 0, 0.1);
            --font-family: 'Arial', sans-serif;
        }

        body {
            font-family: var(--font-family);
            background-color: var(--color-background);
            margin: 0;
            padding: 20px;
            color: var(--color-text);
            line-height: 1.6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh; /* Center content vertically */
        }

        .container {
            max-width: 600px;
            width: 90%;
            margin: auto;
        }

        h1 {
            font-size: 2.2em;
            text-align: center;
            margin-bottom: 30px;
            color: var(--color-primary);
            font-weight: 700;
        }

        /* Card Styling for Result */
        .card {
            background-color: var(--color-surface);
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px var(--color-shadow);
            text-align: center;
            border-left: 5px solid var(--color-primary); /* Success indicator */
        }

        /* Message Paragraph */
        .card p {
            font-size: 1.15em;
            color: #155724; /* Darker green text */
            background-color: #d4edda; /* Light green background */
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 25px;
            font-weight: 600;
            text-align: center;
        }

        /* Button Styling */
        .card a {
            display: inline-block;
            padding: 12px 25px;
            background-color: #007bff; /* Blue for navigation */
            color: #fff;
            text-decoration: none;
            border-radius: 6px;
            font-size: 1em;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: background-color 0.2s, box-shadow 0.2s;
        }

        .card a:hover {
            background-color: #0056b3; /* Darker blue on hover */
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            opacity: 1; /* Override the old opacity style */
        }
        
        /* The pre tag (for block data if it were included, though none is present, good practice to keep the style clean) */
        pre {
            background-color: #f8f8f8;
            padding: 15px;
            border-radius: 6px;
            overflow: auto;
            max-height: 400px;
            font-size: 0.9em;
            text-align: left;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Block Mined Successfully!</h1>
        <div class="card">
            <p>{{ message }}</p>
            <a href="{{ url_for('index') }}">Back to Home</a>
        </div>
    </div>
</body>
</html>
